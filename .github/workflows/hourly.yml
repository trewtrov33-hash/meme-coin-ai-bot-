name: Hourly Leaderboard Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore leaderboard state
        uses: actions/cache/restore@v4
        with:
          path: leaderboard_state.json
          key: leaderboard-state-${{ github.run_id }}
          restore-keys: |
            leaderboard-state-

      - name: Run leaderboard bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python leaderboard_bot.py

      - name: Save leaderboard state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: leaderboard_state.json
          key: leaderboard-state-${{ github.run_id }}
