name: Hourly Leaderboard Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore leaderboard state
        uses: actions/cache/restore@v4
        with:
          path: leaderboard_state.json
          key: leaderboard-state-${{ github.run_id }}
          restore-keys: |
            leaderboard-state-

      - name: Run leaderboard bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          LEADERBOARD_SITE_URL: ${{ vars.LEADERBOARD_SITE_URL }}
        run: python leaderboard_bot.py

      - name: Save leaderboard state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: leaderboard_state.json
          key: leaderboard-state-${{ github.run_id }}

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard to GitHub Pages
        uses: actions/deploy-pages@v4
